# ============================================================================
# 生产环境配置
# 特点：H2 文件模式持久化、关闭 Swagger 与 SQL 日志、收敛跨域来源
# 启动方式：java -jar taskhub-backend.jar --spring.profiles.active=prod
# 敏感信息建议通过环境变量注入，例如：
#   export APP_DB_URL=jdbc:h2:file:/data/taskhub
#   export APP_CORS_ALLOWEDORIGINS=https://taskhub.example.com
# ============================================================================
spring:
  datasource:
    url: ${APP_DB_URL:jdbc:h2:file:./data/taskhub;AUTO_SERVER=TRUE;MODE=MySQL}
    driver-class-name: org.h2.Driver
    username: ${APP_DB_USERNAME:sa}
    password: ${APP_DB_PASSWORD:}
    hikari:
      pool-name: TaskHubHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    # 方言由 Hibernate 自动推断；切换到 MySQL/PostgreSQL 时无需修改此处
    hibernate:
      # 生产环境建议配合 Flyway/Liquibase 做版本化迁移，此处仅做结构增量更新
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://taskhub.example.com}
  # 生产环境不写入演示数据
  seed-data: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.example.taskhub: INFO
  file:
    name: ./logs/taskhub-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
